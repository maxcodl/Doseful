name: Build

# Every push and pull request builds a debug APK.
# Pushing a tag like v0.1.0 builds signed release APKs and publishes a GitHub Release.
#
# Secrets needed for release builds (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of your .jks file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          chmod +x gradlew

      - name: Debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: doseful-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            scanner/build/outputs/apk/debug/*.apk

      - name: Set up signing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Release build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Doseful-${GITHUB_REF_NAME}.apk"
          cp scanner/build/outputs/apk/release/scanner-release.apk "dist/Doseful-Scanner-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
